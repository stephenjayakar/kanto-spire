<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanto Spire - m4a audio test</title>
<style>
  body { font: 14px system-ui, sans-serif; background: #15171c; color: #dde; margin: 0; padding: 16px 20px 40px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 18px 0 6px; color: #9cf; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: #1f232b; padding: 10px 12px; border-radius: 8px; position: sticky; top: 0; z-index: 2; }
  .bar label { display: flex; align-items: center; gap: 6px; }
  button { background: #2c3340; color: #eef; border: 1px solid #3c4556; border-radius: 5px; padding: 4px 8px; cursor: pointer; font: inherit; }
  button:hover { background: #3a4456; }
  button.playing { background: #2f6b3f; border-color: #4a9; }
  .grid { display: flex; flex-wrap: wrap; gap: 4px; }
  .grid button { font-size: 12px; }
  #status { color: #fc6; min-width: 240px; }
  canvas { background: #0c0d10; border-radius: 6px; display: block; margin-top: 8px; width: 100%; height: 90px; }
  input[type=search] { background: #0f1116; color: #eef; border: 1px solid #3c4556; border-radius: 5px; padding: 4px 8px; }
  select, input[type=number] { background: #0f1116; color: #eef; border: 1px solid #3c4556; border-radius: 5px; padding: 3px; }
  .muted { color: #889; font-size: 12px; }
</style>
</head>
<body>
<h1>Kanto Spire audio test <span class="muted">(m4a/MP2K driver in an AudioWorklet, reading the FireRed sound bank)</span></h1>
<div class="bar">
  <span id="status">loading...</span>
  <button id="unlock">Enable audio</button>
  <button id="stopbgm">Stop BGM</button>
  <button id="fade">Fade out BGM</button>
  <button id="stopall">Stop all</button>
  <label>Master <input id="vmaster" type="range" min="0" max="1.5" step="0.01" value="1"></label>
  <label>Music <input id="vmusic" type="range" min="0" max="1" step="0.01" value="1"></label>
  <label>SFX <input id="vsfx" type="range" min="0" max="1" step="0.01" value="1"></label>
  <label><input id="stereo" type="checkbox" checked> stereo</label>
  <label><input id="linear" type="checkbox"> linear upsampling</label>
  <label><input id="fadein" type="checkbox"> fade in BGM</label>
  <input id="filter" type="search" placeholder="filter songs...">
</div>
<canvas id="scope" width="1200" height="90"></canvas>

<h2>Pokemon cries</h2>
<div class="bar" style="position:static">
  <label>Species <select id="species"></select></label>
  <label>Mode <select id="crymode"></select></label>
  <label>Pitch <input id="pitch" type="number" value="15360" step="64" style="width:80px"></label>
  <label>Length <input id="length" type="number" value="140" style="width:60px"></label>
  <label><input id="reverse" type="checkbox"> reverse</label>
  <label><input id="custom" type="checkbox"> use pitch/length (else mode defaults)</label>
  <button id="cry">Play cry</button>
  <button id="cryprev">&lt;</button><button id="crynext">&gt;</button>
</div>

<h2>Background music (BGM player)</h2>
<div class="grid" id="bgm"></div>
<h2>Fanfares / jingles (pause BGM, then resume)</h2>
<div class="grid" id="fanfare"></div>
<h2>Sound effects (SE players 1-3)</h2>
<div class="grid" id="se"></div>

<script type="module">
import { Sound, SONG_NAMES, CRY_MODES } from './src/audio/sound.js';

const $ = (id) => document.getElementById(id);
const status = (t) => { $('status').textContent = t; };

await Sound.init();
const meta = await (await fetch('assets/sound/bank.json')).json();
const names = SONG_NAMES;
status(`${names.length} songs, ${Sound.cryCount} cries loaded - ${Sound.unlocked ? 'audio running' : 'click anywhere to enable audio'}`);

let bgmBtn = null;
function addButtons() {
  const f = $('filter').value.toLowerCase();
  for (const id of ['bgm', 'fanfare', 'se']) $(id).textContent = '';
  for (const n of names) {
    if (f && !n.includes(f)) continue;
    const s = meta.songs[n];
    const b = document.createElement('button');
    b.textContent = n.replace(/^(mus|se)_/, '');
    b.title = `${n}  #${s.index}  player ${s.player}  tracks ${s.tracks}  prio ${s.priority}  reverb ${s.reverb & 0x80 ? s.reverb & 0x7F : 'off'}`;
    if (n.startsWith('se_')) {
      b.onclick = async () => { await Sound.unlock(); b.classList.add('playing'); await Sound.playSE(n); b.classList.remove('playing'); };
      $('se').appendChild(b);
    } else if (s.player !== 0) {
      b.onclick = async () => { await Sound.unlock(); b.classList.add('playing'); await Sound.playFanfare(n); b.classList.remove('playing'); };
      $('fanfare').appendChild(b);
    } else {
      b.onclick = async () => {
        await Sound.unlock();
        Sound.playBGM(n, { restart: true, fadeInFrames: $('fadein').checked ? 120 : 0 });
        if (bgmBtn) bgmBtn.classList.remove('playing');
        bgmBtn = b; b.classList.add('playing');
        status(`BGM: ${n}`);
      };
      $('bgm').appendChild(b);
    }
  }
}
addButtons();
$('filter').oninput = addButtons;

$('unlock').onclick = async () => status((await Sound.unlock()) ? 'audio running' : 'still suspended');
$('stopbgm').onclick = () => { Sound.stopBGM(); bgmBtn && bgmBtn.classList.remove('playing'); };
$('fade').onclick = () => { Sound.fadeOutBGM(120); bgmBtn && bgmBtn.classList.remove('playing'); };
$('stopall').onclick = () => { Sound.stopAll(); bgmBtn && bgmBtn.classList.remove('playing'); };
$('vmaster').oninput = (e) => Sound.setMasterVolume(+e.target.value);
$('vmusic').oninput = (e) => Sound.setMusicVolume(+e.target.value);
$('vsfx').oninput = (e) => Sound.setSfxVolume(+e.target.value);
$('stereo').onchange = (e) => Sound.setStereo(e.target.checked);
$('linear').onchange = (e) => Sound.setInterpolation(e.target.checked ? 'linear' : 'hold');

// cry tester
const species = Object.entries(meta.cries.speciesNames).sort((a, b) => a[1] - b[1]);
for (const [name, id] of species) {
  const o = document.createElement('option');
  o.value = id; o.textContent = `${String(id).padStart(3, '0')} ${name}`;
  $('species').appendChild(o);
}
$('species').value = 25;
for (const m of CRY_MODES) { const o = document.createElement('option'); o.value = o.textContent = m; $('crymode').appendChild(o); }
async function playCry() {
  await Sound.unlock();
  const opts = { mode: $('crymode').value };
  if ($('custom').checked) { opts.pitch = +$('pitch').value; opts.length = +$('length').value; }
  if ($('reverse').checked) opts.reverse = true;
  const id = +$('species').value;
  status(`cry: ${$('species').selectedOptions[0].textContent} (${opts.mode})`);
  await Sound.playCry(id, opts);
}
$('cry').onclick = playCry;
$('cryprev').onclick = () => { const s = $('species'); s.selectedIndex = Math.max(0, s.selectedIndex - 1); playCry(); };
$('crynext').onclick = () => { const s = $('species'); s.selectedIndex = Math.min(s.length - 1, s.selectedIndex + 1); playCry(); };

// oscilloscope
const an = Sound.context.createAnalyser();
an.fftSize = 2048;
Sound.output.connect(an);
const buf = new Float32Array(an.fftSize);
const cv = $('scope'), g = cv.getContext('2d');
(function draw() {
  an.getFloatTimeDomainData(buf);
  g.fillStyle = '#0c0d10'; g.fillRect(0, 0, cv.width, cv.height);
  g.strokeStyle = '#6cf'; g.beginPath();
  for (let i = 0; i < buf.length; i++) {
    const x = i / buf.length * cv.width, y = (0.5 - buf[i] * 0.5) * cv.height;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
  if (Sound.unlocked && $('status').textContent.includes('click anywhere')) status('audio running');
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
